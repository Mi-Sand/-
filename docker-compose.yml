version: '3.8'

services:
  # PostgreSQL база данных
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: secure_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d warehouse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django приложение
  web:
    build: .
    environment:
      DEBUG: "False"
      SECRET_KEY: "django-insecure-change-this-to-long-random-string-in-production"
      DB_ENGINE: postgres
      DB_NAME: warehouse_db
      DB_USER: warehouse_user
      DB_PASSWORD: secure_password_change_me
      DB_HOST: db
      DB_PORT: "5432"
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      DEFAULT_FROM_EMAIL: warehouse@leko.example
      WAREHOUSE_MANAGER_EMAIL: manager@leko.example
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    command: >
      sh -c "
        python manage.py makemigrations accounts warehouse inventory reports &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn warehouse_config.wsgi:application --bind 0.0.0.0:8000 --workers 4
      "

  # nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
