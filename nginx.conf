# nginx перед системой складского учёта.
#
# Отдаёт статику и фотографии товаров сам, остальное передаёт приложению.
# Использовать веб-сервер для файлов заметно быстрее, чем гонять их через
# Python, и снимает нагрузку с рабочих процессов gunicorn.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Сжатие текстовых ответов: страницы интерфейса весят заметно меньше
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Имя и версия сервера в заголовках не сообщаются
    server_tokens off;

    upstream warehouse {
        server web:8000;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Запас на загрузку фотографий и видео товаров
        client_max_body_size 100M;

        # --- Статика ---------------------------------------------------
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # --- Фотографии и видео товаров --------------------------------
        #
        # Без этого блока витрина осталась бы без картинок: в боевом
        # режиме Django медиафайлы не раздаёт, а запрос ушёл бы к нему
        # и вернул 404. Срок кэша меньше, чем у статики: фотографию
        # товара могут заменить, не меняя имени файла.
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # --- Приложение ------------------------------------------------
        location / {
            proxy_pass http://warehouse;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

            # Выгрузка отчётов в Excel на большой базе занимает время
            proxy_read_timeout 120s;
        }

        # --- Проверка живости ------------------------------------------
        location /health {
            access_log off;
            return 200 "healthy\n";
        }
    }
}
