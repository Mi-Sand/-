{% extends 'base.html' %}
{% block title %}Отчёты | Складской учёт{% endblock %}
{% block page_title %}<svg class="ic"><use href="#i-chart"></use></svg> Отчёты{% endblock %}

{% block extra_css %}
<style>
    .tabs { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; border-bottom: 2px solid var(--line); }
    .tab { padding: 12px 20px; cursor: pointer; border: none; background: none; font-size: 14px;
        color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .tab:hover { color: var(--slate-800); }
    .tab.active { color: var(--slate-800); font-weight: 600; border-bottom-color: var(--slate-800); }
    .report-controls { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
    .report-controls input, .report-controls select {
        padding: 10px; border: 1px solid var(--line-strong); border-radius: 4px; font-size: 14px; }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn-primary { background: var(--slate-800); color: white; }
    .btn-primary:hover { background: var(--slate-900); }
    .btn-excel { background: var(--ok); color: white; }
    .btn-excel:hover { background: var(--ok); }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    table th { background: var(--slate-800); color: white; padding: 12px; text-align: left; font-weight: 600; font-size: 13px; }
    table td { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
    table tr:hover { background: var(--surface-alt); }
    .summary { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .summary-card { background: var(--surface-alt); padding: 15px 20px; border-radius: 8px; border-left: 4px solid var(--slate-800); }
    .summary-card .label { font-size: 12px; color: var(--ink-2); }
    .summary-card .value { font-size: 24px; font-weight: 600; color: var(--slate-800); }
    .loading { text-align: center; padding: 40px; color: var(--ink-3); }
    .empty { text-align: center; padding: 40px; color: var(--ink-3); }
    .error { background: var(--stop-soft); color: var(--stop); padding: 15px; border-radius: 4px; border-left: 4px solid var(--stop); margin-bottom: 20px; }
    .neg { color: var(--stop); font-weight: 600; }
    .pos { color: var(--ok); font-weight: 600; }
</style>
{% endblock %}

{% block content %}
<div id="message"></div>

<div class="tabs">
    <button class="tab active" onclick="switchTab('stock', this)"><svg class="ic"><use href="#i-box"></use></svg> Остатки</button>
    <button class="tab" onclick="switchTab('movement', this)"><svg class="ic"><use href="#i-refresh"></use></svg> Движение</button>
    <button class="tab" onclick="switchTab('reorder', this)"><svg class="ic"><use href="#i-cart"></use></svg> К закупке</button>
    <button class="tab" onclick="switchTab('inventory', this)"><svg class="ic"><use href="#i-clipboard"></use></svg> Инвентаризации</button>
    <button class="tab" onclick="switchTab('reconciliation', this)"><svg class="ic"><use href="#i-clipboard"></use></svg> Акт сверки</button>
</div>

<div id="controls" class="report-controls"></div>
<div id="reportArea"><div class="loading">Выберите отчёт</div></div>

<script>
    let currentTab = 'stock';

    function switchTab(tab, el) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        renderControls();
        loadReport();
    }

    function renderControls() {
        const c = document.getElementById('controls');
        if (currentTab === 'stock') {
            c.innerHTML = `
                <button class="btn btn-primary" onclick="loadReport()"><svg class="ic"><use href="#i-refresh"></use></svg> Обновить</button>
                <button class="btn btn-excel" onclick="exportExcel()"><svg class="ic"><use href="#i-inbound"></use></svg> Выгрузить в Excel</button>`;
        } else if (currentTab === 'movement') {
            c.innerHTML = `
                <label>Период (дней назад):</label>
                <select id="days">
                    <option value="7">7 дней</option>
                    <option value="30" selected>30 дней</option>
                    <option value="90">90 дней</option>
                    <option value="365">Год</option>
                </select>
                <button class="btn btn-primary" onclick="loadReport()"><svg class="ic"><use href="#i-refresh"></use></svg> Показать</button>`;
        } else if (currentTab === 'reconciliation') {
            // Период по умолчанию — текущий год: акт сверки чаще всего
            // составляют именно за год или за квартал внутри него.
            const year = new Date().getFullYear();
            c.innerHTML = `
                <label>Покупатель:</label>
                <select id="counterparty"><option value="">Загрузка...</option></select>
                <label>с</label>
                <input type="date" id="dateFrom" value="${year}-01-01">
                <label>по</label>
                <input type="date" id="dateTo" value="${new Date().toISOString().slice(0, 10)}">
                <button class="btn btn-excel" onclick="downloadReconciliation()"><svg class="ic"><use href="#i-inbound"></use></svg> Выгрузить акт</button>`;
            loadCounterparties();
        } else {
            c.innerHTML = `<button class="btn btn-primary" onclick="loadReport()"><svg class="ic"><use href="#i-refresh"></use></svg> Обновить</button>`;
        }
    }

    async function loadCounterparties() {
        const select = document.getElementById('counterparty');
        try {
            const data = await apiCallAll('/counterparties/');
            if (!data.length) {
                select.innerHTML = '<option value="">Нет покупателей-организаций</option>';
                return;
            }
            select.innerHTML = data.map(c =>
                `<option value="${c.id}">${esc(c.short_name)} (ИНН ${esc(c.inn)})</option>`
            ).join('');
        } catch (error) {
            select.innerHTML = '<option value="">Ошибка загрузки</option>';
        }
    }

    async function downloadReconciliation() {
        const id = document.getElementById('counterparty').value;
        if (!id) {
            showMessage('Выберите покупателя', 'error');
            return;
        }
        const from = document.getElementById('dateFrom').value;
        const to = document.getElementById('dateTo').value;
        await downloadFile(
            `/api/reconciliation/?counterparty=${id}&from=${from}&to=${to}`,
            'Акт сверки.xlsx');
    }

    // Скачивание файла с разбором ответа: при отказе сервера — например,
    // не заполнены реквизиты организации — браузер иначе сохранил бы текст
    // ошибки под именем книги Excel, и сотрудник увидел бы «повреждённый
    // файл» вместо объяснения, что не так.
    async function downloadFile(url, fallbackName) {
        try {
            const response = await fetch(url, { credentials: 'same-origin' });
            if (!response.ok) {
                let message = `Не удалось получить документ (${response.status})`;
                try {
                    const data = await response.json();
                    if (data && data.error) message = data.error;
                } catch (e) { /* ответ не JSON — оставляем общий текст */ }
                showMessage(message, 'error');
                return;
            }
            const disposition = response.headers.get('Content-Disposition') || '';
            const match = disposition.match(/filename\*=UTF-8''([^;]+)/);
            const filename = match ? decodeURIComponent(match[1]) : fallbackName;

            const blob = await response.blob();
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        } catch (error) {
            showMessage('Не удалось получить документ: ' + error.message, 'error');
        }
    }

    async function loadReport() {
        const area = document.getElementById('reportArea');

        // Акт сверки на экране не показывается: это документ на подпись,
        // его сразу выгружают файлом. Вместо таблицы — пояснение, что
        // попадает в акт, чтобы бухгалтер не гадал, почему сумм меньше.
        if (currentTab === 'reconciliation') {
            area.innerHTML = `
                <div class="loading" style="text-align:left; padding:20px 0;">
                    Выберите покупателя и период, затем нажмите «Выгрузить акт».<br><br>
                    В акт попадают отгруженные заказы и внесённые оплаты.
                    Заказы, ещё не отгруженные, не учитываются: обязательство
                    по ним пока не возникло. Отменённые заказы не учитываются вовсе.<br><br>
                    Оплаты вносятся в админке, раздел «Оплаты».
                </div>`;
            return;
        }

        area.innerHTML = '<div class="loading">Загрузка отчёта...</div>';
        try {
            if (currentTab === 'stock') await loadStock(area);
            else if (currentTab === 'movement') await loadMovement(area);
            else if (currentTab === 'reorder') await loadReorder(area);
            else if (currentTab === 'inventory') await loadInventory(area);
        } catch (error) {
            area.innerHTML = `<div class="error">Ошибка загрузки: ${esc(error.message)}</div>`;
        }
    }

    async function loadStock(area) {
        const data = await apiCall('/reports/stock/');
        const rows = data['строки'] || [];
        if (rows.length === 0) { area.innerHTML = '<div class="empty">Нет остатков на складах</div>'; return; }
        area.innerHTML = `
            <div class="summary"><div class="summary-card">
                <div class="label">Всего позиций с остатком</div>
                <div class="value">${data['всего_позиций']}</div>
            </div></div>
            <table><thead><tr>
                <th>Склад</th><th>Тип</th><th>Наименование</th><th>Артикул</th>
                <th>Размер</th><th>Цвет</th><th>Количество</th><th>Ед.</th>
            </tr></thead><tbody>
                ${rows.map(r => `<tr>
                    <td>${r['склад']}</td><td>${r['тип']}</td><td>${r['наименование']}</td>
                    <td>${r['артикул']}</td><td>${r['размер']}</td><td>${r['цвет']}</td>
                    <td>${r['количество']}</td><td>${r['единица']}</td>
                </tr>`).join('')}
            </tbody></table>`;
    }

    async function loadMovement(area) {
        const days = document.getElementById('days').value;
        const data = await apiCall(`/reports/movement/?days=${days}`);
        const rows = data['строки'] || [];
        area.innerHTML = `
            <div class="summary">
                <div class="summary-card"><div class="label">Приход за период</div><div class="value pos">+${data['приход_кол']}</div></div>
                <div class="summary-card"><div class="label">Расход за период</div><div class="value neg">${data['расход_кол']}</div></div>
                <div class="summary-card"><div class="label">Всего операций</div><div class="value">${data['всего_операций']}</div></div>
            </div>
            ${rows.length === 0 ? '<div class="empty">Нет операций за выбранный период</div>' : `
            <table><thead><tr>
                <th>Дата</th><th>Тип</th><th>Товар</th><th>Кол-во</th><th>Склад</th><th>Пользователь</th>
            </tr></thead><tbody>
                ${rows.map(r => `<tr>
                    <td>${r['дата']}</td><td>${r['тип']}</td><td>${r['товар']}</td>
                    <td>${r['количество']}</td><td>${r['склад']}</td><td>${r['пользователь']}</td>
                </tr>`).join('')}
            </tbody></table>`}`;
    }

    async function loadReorder(area) {
        const data = await apiCall('/reports/reorder/');
        const rows = data['строки'] || [];
        if (rows.length === 0) {
            area.innerHTML = '<div class="empty"><svg class="ic"><use href="#i-check"></use></svg> Все материалы в достаточном количестве, закупка не требуется</div>';
            return;
        }
        area.innerHTML = `
            <div class="summary"><div class="summary-card" style="border-left-color:var(--stop);">
                <div class="label">Позиций в дефиците</div>
                <div class="value neg">${data['позиций_в_дефиците']}</div>
            </div></div>
            <table><thead><tr>
                <th>Наименование</th><th>Категория</th><th>Текущий остаток</th>
                <th>Минимум</th><th>Нехватка</th><th>Ед.</th>
            </tr></thead><tbody>
                ${rows.map(r => `<tr>
                    <td>${r['наименование']}</td><td>${r['категория']}</td>
                    <td>${r['текущий_остаток']}</td><td>${r['минимум']}</td>
                    <td class="neg">${r['недостаток']}</td><td>${r['единица']}</td>
                </tr>`).join('')}
            </tbody></table>`;
    }

    async function loadInventory(area) {
        const data = await apiCall('/reports/inventory/');
        const results = data['результаты'] || [];
        if (results.length === 0) {
            area.innerHTML = '<div class="empty">Завершённых инвентаризаций пока нет</div>';
            return;
        }
        area.innerHTML = `
            <div class="summary"><div class="summary-card">
                <div class="label">Всего инвентаризаций</div>
                <div class="value">${data['всего_инвентаризаций']}</div>
            </div></div>
            <table><thead><tr>
                <th>Номер</th><th>Склад</th><th>Дата</th><th>Недостач</th><th>Излишков</th>
            </tr></thead><tbody>
                ${results.map(r => `<tr>
                    <td>${r['номер']}</td><td>${r['склад']}</td>
                    <td>${r['дата_завершения'] || '—'}</td>
                    <td class="${r['недостач'] > 0 ? 'neg' : ''}">${r['недостач']}</td>
                    <td class="${r['излишков'] > 0 ? 'pos' : ''}">${r['излишков']}</td>
                </tr>`).join('')}
            </tbody></table>`;
    }

    function exportExcel() {
        // Открываем эндпоинт экспорта напрямую — браузер скачает файл
        window.location.href = '/api/reports/stock/export/';
    }

    function showMessage(text, type) {
        const msg = document.getElementById('message');
        msg.innerHTML = `<div class="error">${text}</div>`;
        setTimeout(() => { msg.innerHTML = ''; }, 5000);
    }

    renderControls();
    loadReport();
</script>
{% endblock %}
