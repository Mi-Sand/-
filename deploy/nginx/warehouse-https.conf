# nginx перед складской системой: работа по HTTPS.
#
# Этот файл — образец. Замените три вещи и положите рядом с nginx:
#
#   1. sklad.leko.local      — имя, по которому сотрудники открывают систему
#   2. пути к сертификату    — их выдаёт СДЕЛАТЬ-СЕРТИФИКАТ.ps1
#   3. 127.0.0.1:8000        — адрес самой системы, если она не на этой машине
#
# Порядок целиком описан в HTTPS.md.

worker_processes 1;
events { worker_connections 1024; }

http {
    # Виды файлов перечислены здесь, а не взяты из mime.types рядом с
    # nginx. Строка include ищет файл рядом с этой настройкой, а она
    # лежит в папке программы — и nginx останавливался, не найдя его.
    # Список короткий: с диска nginx отдаёт только оформление страниц и
    # фотографии, всё остальное идёт от самой системы со своей пометкой.
    #
    # Пометка обязательна: без неё браузер считает файл оформления
    # просто набором байтов и не применяет его — страницы открываются
    # голым текстом.
    types {
        text/html                             html htm;
        text/css                              css;
        text/plain                            txt;
        application/javascript                js;
        application/json                      json map;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff                             woff;
        font/woff2                            woff2;
        font/ttf                              ttf;
        application/pdf                       pdf;
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet  xlsx;
    }
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;          # не сообщать версию nginx в заголовках

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # --- Обращения по http перенаправляются на https --------------------
    server {
        listen 80;
        server_name sklad.leko.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name sklad.leko.local;
        # HTTP/2 намеренно не включён: на нём выигрыш заметен на сотнях
        # мелких запросов через интернет, а внутри предприятия его нет.
        # Зато директива для него в разных версиях nginx пишется
        # по-разному, и на чужой версии файл просто не запустится.

        ssl_certificate     C:/warehouse_project/deploy/nginx/sklad.crt;
        ssl_certificate_key C:/warehouse_project/deploy/nginx/sklad.key;

        # Старые версии протокола отключены: они дырявые, а поддерживать
        # ими нечего — браузеры на рабочих местах давно умеют TLS 1.2.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Запас на загрузку фотографий и видео товаров
        client_max_body_size 100M;

        # --- Статика и фотографии отдаёт сам nginx ----------------------
        # Гонять файлы через Python незачем: веб-сервер делает это
        # быстрее и не занимает рабочие процессы приложения.
        location /static/ {
            alias C:/warehouse_project/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /media/ {
            alias C:/warehouse_project/media/;
            expires 7d;
            access_log off;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Без этой строки система считает соединение незащищённым и
            # перенаправляет браузер на https по кругу.
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
        }
    }
}
